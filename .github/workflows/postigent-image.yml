name: "Postigent Image"

# Builds the Postigent (rebranded Postiz) image and publishes it to GHCR.
# - push to the `postigent` branch -> :edge and :sha-<short>
# - push a `postigent-v*` tag     -> :<tag> and :latest
on:
  workflow_dispatch:
  push:
    branches:
      - postigent
    tags:
      - 'postigent-v*'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/oladapodaniel/postigent

concurrency:
  group: postigent-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      extra: ${{ steps.v.outputs.extra }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "extra=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "extra=edge" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tags
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        env:
          VERSION: ${{ needs.tags.outputs.version }}
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=${VERSION} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.version=${VERSION} \
            --label org.opencontainers.image.licenses=AGPL-3.0 \
            --pull \
            --provenance=false --sbom=false \
            --output "type=registry,name=${IMAGE}:${VERSION}-${{ matrix.arch }}" .

  manifest:
    needs: [tags, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish multi-arch tags
        env:
          VERSION: ${{ needs.tags.outputs.version }}
          EXTRA: ${{ needs.tags.outputs.extra }}
        run: |
          for t in "${VERSION}" "${EXTRA}"; do
            docker buildx imagetools create -t "${IMAGE}:${t}" \
              "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64"
          done
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
